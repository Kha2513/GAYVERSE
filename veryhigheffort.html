<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    function toggleMenu() {
        const menu = document.getElementById('dropdown-menu');
        menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    function toggleChat() {
        const chat = document.getElementById('chat-container');
        chat.style.display = (chat.style.display === 'none') ? 'flex' : 'none';
    }

    function leaveGame() {
        if (isMobileMode || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            window.location.href = 'm_home.aspx';
        } else {
            document.body.innerHTML = `
                <div style="background: #000000; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ffffff; font-family: 'Verdana', sans-serif; text-align: center; padding: 20px;">
                    <h1 style="font-size: 36px; margin-bottom: 15px;">You have left the game.</h1>
                    <p style="font-size: 20px;">You can now close this window.</p>
                </div>
            `;
        }
    }

    function reportUser() {
        window.location.href = 'https://buildverse.boards.net/board/9/report-user';
    }

    function updateInventoryUI() {
        const slotsContainer = document.getElementById('inventory-slots');
        slotsContainer.innerHTML = '';
        
        let items = [];
        if (hasSwordEquipped) {
            items.push("Sword");
        }

        for (let i = 0; i < 3; i++) {
            const slot = document.createElement('div');
            if (items[i]) {
                slot.className = 'inv-slot';
                slot.textContent = items[i];
            } else {
                slot.className = 'inv-slot empty';
                slot.textContent = 'Empty';
            }
            slotsContainer.appendChild(slot);
        }
    }

    function spawnSafely() {
        if (!localMesh) return;
        
        let targetX = 0;
        let targetZ = 0;
        let targetY = 50;

        for (let attempt = 0; attempt < 30; attempt++) {
            let testBox = getPlayerBox(targetX, targetY, targetZ);
            if (!checkCollision(testBox)) {
                break; 
            }
            targetX = (Math.random() - 0.5) * 100;
            targetZ = (Math.random() - 0.5) * 100;
        }

        localMesh.position.set(targetX, targetY, targetZ);
        velocityY = 0;
        isGrounded = false;
    }

    function resetBuilder() {
        spawnSafely();
        playerHealth = 100;
        let respawnXhr = new XMLHttpRequest();
        respawnXhr.open("GET", `game.aspx?action=respawn&room=${encodeURIComponent(roomName)}&user=${encodeURIComponent(localPlayerName)}`, true);
        respawnXhr.send();
        const healthFill = document.getElementById('health-bar-fill');
        healthFill.style.width = '100%';
        healthFill.style.backgroundColor = '#00ff00';
        toggleMenu();
    }

    const serverMapData = `0.00,0.50,0.00,64.00,1.00,64.00,#635f62\n-31.00,2.00,25.00,1.50,51.50,16.50,#c4281c\n-31.50,2.00,-17.50,1.50,54.00,29.50,#c4281c\n-72.50,0.50,0.00,81.50,1.00,69.00,#1b2a35\n-72.50,11.50,31.00,83.00,32.00,2.00,#c4281c\n-72.50,2.00,-32.50,83.50,53.50,2.00,#c4281c\n-112.00,2.00,21.50,2.50,51.00,21.00,#c4281c\n-112.00,2.00,-26.00,4.00,53.00,11.50,#c4281c\n-95.00,28.00,0.00,131.50,1.00,73.00,#635f62\n-143.00,0.50,0.00,63.50,1.00,64.50,#a3a2a5\n-134.00,7.50,22.50,44.00,41.50,2.00,#a3a2a5\n-133.00,2.00,-29.00,41.00,56.50,3.00,#a3a2a5\n-152.50,2.00,0.00,4.00,55.00,60.50,#a3a2a5\n-149.50,8.50,0.00,27.00,1.00,59.00,#635F62\n-180.00,2.00,0.00,50.50,52.00,72.50,#C4281C\n-143.00,9.00,0.00,13.00,1.00,14.50,#F5CD30\n-142.00,9.50,0.00,10.00,1.00,13.00,#C4281C`;
    let serverAvatarData = `d0d0d0|0088cc|d0d0d0|d0d0d0|228888|228888`;
    let localPlayerName = "123real" || "Player";
    let roomName = "TACODEVIL_" + "PizzaPlace";
    let isGameRunning = true;

    let playerHealth = 100;
    let hasSwordEquipped = false;
    let isSwinging = false;
    let swordSwingProgress = 0;

    let isMobileMode = false;
    let joystickVector = { x: 0, y: 0 };
    let joystickActive = false;
    let joystickTouchId = null;
    let touchCameraId = null;
    let touchCameraLastPos = { x: 0, y: 0 };

    function enableMobileUI() {
        isMobileMode = true;
        document.getElementById('mobile-controls').style.display = 'block';
    }

    function generateSmileyTexture(headColorHex) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        const hexStr = (headColorHex || 0xf5cd2f).toString(16).padStart(6, '0');
        ctx.fillStyle = '#' + hexStr;
        ctx.fillRect(0, 0, 256, 256);

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(108, 105, 8, 0, Math.PI * 2);
        ctx.arc(148, 105, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';
        ctx.beginPath();
        ctx.arc(128, 122, 26, 0.15 * Math.PI, 0.85 * Math.PI, false);
        ctx.stroke();

        return new THREE.CanvasTexture(canvas);
    }

    function parseColor(str, defaultHex) {
        if (!str) return defaultHex;
        str = str.trim().replace('#', '').replace('0x', '');
        
        if (str.includes(',') || str.includes(' ')) {
            const parts = str.split(/[\s,]+/).map(n => parseInt(n, 10));
            if (parts.length >= 3 && !parts.some(isNaN)) {
                return (parts[0] << 16) + (parts[1] << 8) + parts[2];
            }
        }
        
        const parsed = parseInt(str, 16);
        return isNaN(parsed) ? defaultHex : parsed;
    }

    function parseAvatarColors(avatarStr, defaultTorsoHex) {
        const colors = {
            head: 0xf5cd2f,
            torso: defaultTorsoHex || 0x0088cc,
            leftArm: 0xf5cd2f,
            rightArm: 0xf5cd2f,
            leftLeg: 0x228888,
            rightLeg: 0x228888
        };

        if (!avatarStr || typeof avatarStr !== 'string') return colors;

        const lines = avatarStr.split(/[\r\n]+/).map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) return colors;

        let hasKeys = false;
        lines.forEach(line => {
            if (line.includes('=')) {
                hasKeys = true;
                const kv = line.split('=');
                const key = kv[0].trim().toLowerCase();
                const val = parseColor(kv[1], 0);
                
                if (key.includes('head')) colors.head = val;
                else if (key.includes('torso')) colors.torso = val;
                else if (key.includes('leftarm')) colors.leftArm = val;
                else if (key.includes('rightarm')) colors.rightArm = val;
                else if (key.includes('leftleg')) colors.leftLeg = val;
                else if (key.includes('rightleg')) colors.rightLeg = val;
                else if (key.includes('arm')) { colors.leftArm = val; colors.rightArm = val; }
                else if (key.includes('leg')) { colors.leftLeg = val; colors.rightLeg = val; }
            }
        });

        if (!hasKeys) {
            let items = lines;
            if (lines.length === 1 && (lines[0].includes('|') || lines[0].includes(','))) {
                items = lines[0].split(/[|,]/).map(s => s.trim());
            }

            if (items[0]) colors.head = parseColor(items[0], colors.head);
            if (items[1]) colors.torso = parseColor(items[1], colors.torso);
            if (items[2]) colors.leftArm = parseColor(items[2], colors.leftArm);
            if (items[3]) colors.rightArm = parseColor(items[3], colors.rightArm);
            if (items[4]) colors.leftLeg = parseColor(items[4], colors.leftLeg);
            if (items[5]) colors.rightLeg = parseColor(items[5], colors.rightLeg);
        }

        return colors;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(10, 30, 20);
    scene.add(dirLight);

    const waterGeo = new THREE.PlaneGeometry(1000, 1000);
    const waterMat = new THREE.MeshBasicMaterial({ color: 0x0044ff });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = -5;
    scene.add(water);

    const collisionBoxes = [];
    const remotePlayers = {};
    let lastProcessedChatId = 0;

    function createNameTag(name) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        
        ctx.font = "bold 48px 'Verdana', sans-serif";
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 5;
        
        ctx.strokeText(name, 256, 64);
        ctx.fillText(name, 256, 64);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(spriteMaterial);
        
        sprite.scale.set(4, 1, 1); 
        sprite.position.y = 5.2; 
        
        return sprite;
    }

    function createClassicAvatar(colorConfig, name, includeSword) {
        const group = new THREE.Group();
        const colors = (typeof colorConfig === 'object') ? colorConfig : parseAvatarColors("", colorConfig);

        const torsoGeo = new THREE.BoxGeometry(1.6, 1.4, 0.8);
        const torsoMat = new THREE.MeshLambertMaterial({ color: colors.torso });
        const torso = new THREE.Mesh(torsoGeo, torsoMat);
        torso.position.y = 2.1;
        group.add(torso);

        const headTexture = generateSmileyTexture(colors.head);
        const headGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const headMat = new THREE.MeshLambertMaterial({ map: headTexture });
        const head = new THREE.Mesh(headGeo, headMat);
        head.rotation.y = Math.PI / 2;
        head.position.y = 3.5; 
        group.add(head);

        const legGeo = new THREE.BoxGeometry(0.8, 1.4, 0.8);
        const leftLegMat = new THREE.MeshLambertMaterial({ color: colors.leftLeg });
        const leftLeg = new THREE.Mesh(legGeo, leftLegMat);
        leftLeg.position.set(-0.4, 0.7, 0);
        group.add(leftLeg);

        const rightLegMat = new THREE.MeshLambertMaterial({ color: colors.rightLeg });
        const rightLeg = new THREE.Mesh(legGeo, rightLegMat);
        rightLeg.position.set(0.4, 0.7, 0);
        group.add(rightLeg);

        const armGeo = new THREE.BoxGeometry(0.8, 1.4, 0.8);
        const leftArmMat = new THREE.MeshLambertMaterial({ color: colors.leftArm });
        const leftArm = new THREE.Mesh(armGeo, leftArmMat);
        leftArm.position.set(-1.2, 2.1, 0);
        group.add(leftArm);

        const rightArmMat = new THREE.MeshLambertMaterial({ color: colors.rightArm });
        const rightArm = new THREE.Mesh(armGeo, rightArmMat);
        rightArm.position.set(1.2, 2.1, 0);
        rightArm.name = "rightArm";
        group.add(rightArm);

        if (includeSword) {
            const swordGroup = new THREE.Group();
            swordGroup.name = "equippedSword";

            const handleGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8);
            const handleMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
            const handleMesh = new THREE.Mesh(handleGeo, handleMat);
            handleMesh.position.set(0, -0.3, 0);
            swordGroup.add(handleMesh);

            const guardGeo = new THREE.BoxGeometry(0.6, 0.08, 0.2);
            const guardMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
            const guardMesh = new THREE.Mesh(guardGeo, guardMat);
            guardMesh.position.set(0, 0, 0);
            swordGroup.add(guardMesh);

            const bladeGeo = new THREE.BoxGeometry(0.2, 1.4, 0.06);
            const bladeMat = new THREE.MeshLambertMaterial({ color: 0xdcdcdc });
            const bladeMesh = new THREE.Mesh(bladeGeo, bladeMat);
            bladeMesh.position.set(0, 0.75, 0);
            swordGroup.add(bladeMesh);

            swordGroup.position.set(0, -0.7, 0.4);
            swordGroup.rotation.x = -Math.PI / 2;
            rightArm.add(swordGroup);
        }

        if (name) {
            const nameTag = createNameTag(name);
            group.add(nameTag);
        }

        group.scale.set(1.8, 1.8, 1.8);
        return group;
    }

    let localAvatarColors = parseAvatarColors(serverAvatarData, 0x0088cc);
    let localMesh = createClassicAvatar(localAvatarColors, localPlayerName, hasSwordEquipped);
    scene.add(localMesh);
    updateInventoryUI();

    function rebuildLocalAvatar(avatarStr) {
        scene.remove(localMesh);
        localAvatarColors = parseAvatarColors(avatarStr, 0x0088cc);
        localMesh = createClassicAvatar(localAvatarColors, localPlayerName, hasSwordEquipped);
        scene.add(localMesh);
        updateInventoryUI();
    }

    let velocityY = 0;
    const gravity = -0.015;
    const jumpStrength = 0.38;
    let isGrounded = false;

    function getPlayerBox(x, y, z) {
        return new THREE.Box3(
            new THREE.Vector3(x - 1.2, y + 0.05, z - 1.2),
            new THREE.Vector3(x + 1.2, y + 7.2, z + 1.2)
        );
    }

    function checkCollision(box) {
        for (let i = 0; i < collisionBoxes.length; i++) {
            if (box.intersectsBox(collisionBoxes[i])) {
                return true;
            }
        }
        return false;
    }

    let cameraYaw = 0;
    let cameraPitch = 0.25;
    let cameraDistance = 16;
    let isMouseDown = false;
    let previousMousePosition = { x: 0, y: 0 };

    window.addEventListener('mousedown', (e) => {
        if (isChatFocused) return;
        
        const joystickEl = document.getElementById('joystick-base');
        const jumpBtnEl = document.getElementById('mobile-jump-btn');
        if (e.target === joystickEl || joystickEl.contains(e.target) || 
            e.target === jumpBtnEl || jumpBtnEl.contains(e.target)) {
            return;
        }

        if (e.button === 0) {
            if (hasSwordEquipped && !isSwinging) {
                isSwinging = true;
                swordSwingProgress = 0;

                const rightArmObj = localMesh.getObjectByName("rightArm");
                if (rightArmObj) {
                    const swordGroup = rightArmObj.getObjectByName("equippedSword");
                    if (swordGroup) {
                        localMesh.matrixAutoUpdate = true;
                        localMesh.updateMatrix();
                        localMesh.updateMatrixWorld(true);
                        swordGroup.updateMatrixWorld(true);

                        const swordBox = new THREE.Box3().setFromObject(swordGroup);
                        swordBox.expandByScalar(1.5);

                        Object.keys(remotePlayers).forEach(name => {
                            const rp = remotePlayers[name];
                            if (rp) {
                                rp.updateMatrixWorld(true);
                                const playerBox = new THREE.Box3().setFromObject(rp);

                                if (swordBox.intersectsBox(playerBox)) {
                                    let xhr = new XMLHttpRequest();
                                    xhr.open("GET", `game.aspx?action=hit&room=${encodeURIComponent(roomName)}&user=${encodeURIComponent(localPlayerName)}&target=${encodeURIComponent(name)}`, true);
                                    xhr.send();
                                }
                            }
                        });
                    }
                }
            }
        }

        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SVG' && e.target.tagName !== 'PATH') {
            isMouseDown = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;
        cameraYaw += deltaX * 0.005;
        cameraPitch -= deltaY * 0.005;
        cameraPitch = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, cameraPitch));
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('wheel', (e) => {
        if (!isChatFocused) {
            cameraDistance += e.deltaY * 0.01;
            cameraDistance = Math.max(6, Math.min(40, cameraDistance));
        }
    });

    const joystickBase = document.getElementById('joystick-base');
    const joystickThumb = document.getElementById('joystick-thumb');
    const jumpBtn = document.getElementById('mobile-jump-btn');

    function getEventPos(e) {
        if (e.touches && e.touches.length > 0) {
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === joystickTouchId) {
                    return { clientX: e.touches[i].clientX, clientY: e.touches[i].clientY };
                }
            }
            return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
        }
        if (e.changedTouches && e.changedTouches.length > 0) {
            return { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY };
        }
        return { clientX: e.clientX, clientY: e.clientY };
    }

    function updateJoystick(e) {
        const rect = joystickBase.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const pos = getEventPos(e);
        let deltaX = pos.clientX - centerX;
        let deltaY = pos.clientY - centerY;
        const maxRadius = rect.width / 2;
        const distance = Math.hypot(deltaX, deltaY);

        if (distance > maxRadius) {
            deltaX = (deltaX / distance) * maxRadius;
            deltaY = (deltaY / distance) * maxRadius;
        }

        joystickThumb.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
        
        joystickVector.x = deltaX / maxRadius;
        joystickVector.y = deltaY / maxRadius;
    }

    function handleJoystickStart(e) {
        e.preventDefault();
        e.stopPropagation();
        joystickActive = true;
        if (e.changedTouches && e.changedTouches.length > 0) {
            joystickTouchId = e.changedTouches[0].identifier;
        }
        updateJoystick(e);
    }

    function handleJoystickMove(e) {
        if (!joystickActive) return;
        e.preventDefault();
        e.stopPropagation();
        updateJoystick(e);
    }

    function handleJoystickEnd(e) {
        if (!joystickActive) return;
        e.stopPropagation();
        joystickActive = false;
        joystickTouchId = null;
        joystickVector = { x: 0, y: 0 };
        joystickThumb.style.transform = `translate(-50%, -50%)`;
    }

    joystickBase.addEventListener('touchstart', handleJoystickStart, { passive: false });
    joystickBase.addEventListener('touchmove', handleJoystickMove, { passive: false });
    joystickBase.addEventListener('touchend', handleJoystickEnd);
    joystickBase.addEventListener('touchcancel', handleJoystickEnd);

    joystickBase.addEventListener('mousedown', handleJoystickStart);
    window.addEventListener('mousemove', (e) => {
        if (joystickActive && !e.touches) handleJoystickMove(e);
    });
    window.addEventListener('mouseup', (e) => {
        if (joystickActive && !e.touches) handleJoystickEnd(e);
    });

    function handleJumpStart(e) {
        e.preventDefault();
        e.stopPropagation();
        if (isGrounded) {
            velocityY = jumpStrength;
            isGrounded = false;
        }
    }

    jumpBtn.addEventListener('touchstart', handleJumpStart, { passive: false });
    jumpBtn.addEventListener('mousedown', handleJumpStart);

    window.addEventListener('touchstart', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            if (touch.clientX > window.innerWidth / 2 && touch.clientY > 100 && touchCameraId === null) {
                if (e.target === jumpBtn || jumpBtn.contains(e.target)) continue;
                touchCameraId = touch.identifier;
                touchCameraLastPos = { x: touch.clientX, y: touch.clientY };
            }
        }
    });

    window.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            if (touch.identifier === touchCameraId) {
                const deltaX = touch.clientX - touchCameraLastPos.x;
                const deltaY = touch.clientY - touchCameraLastPos.y;

                cameraYaw += deltaX * 0.008;
                cameraPitch -= deltaY * 0.008;
                cameraPitch = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, cameraPitch));

                touchCameraLastPos = { x: touch.clientX, y: touch.clientY };
            }
        }
    });

    const resetTouchCamera = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchCameraId) {
                touchCameraId = null;
                break;
            }
        }
    };

    window.addEventListener('touchend', resetTouchCamera);
    window.addEventListener('touchcancel', resetTouchCamera);

    function parseAndRenderBDVR(bdvrText) {
        if (!bdvrText) return;
        const lines = bdvrText.split(/\r?\n/);
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) return;

            const cleanLine = trimmed.toLowerCase().replace(/\s+/g, '');
            if (cleanLine.includes('givetool=sword') || cleanLine.includes('givetool,sword')) {
                hasSwordEquipped = true;
                rebuildLocalAvatar(serverAvatarData);
                return;
            }

            const parts = trimmed.split(',');
            if (parts.length >= 7) {
                const px = parseFloat(parts[0]);
                const py = parseFloat(parts[1]);
                const pz = parseFloat(parts[2]);
                const sx = parseFloat(parts[3]);
                const sy = parseFloat(parts[4]);
                const sz = parseFloat(parts[5]);
                const colorRaw = parts[6].trim().replace('#', '');
                const colorHex = parseInt(colorRaw, 16);

                const geo = new THREE.BoxGeometry(sx, sy, sz);
                const mat = new THREE.MeshLambertMaterial({ color: isNaN(colorHex) ? 0xcccccc : colorHex });
                const mesh = new THREE.Mesh(geo, mat);

                mesh.position.set(px, py, pz);
                scene.add(mesh);

                const box = new THREE.Box3().setFromObject(mesh);
                collisionBoxes.push(box);
            }
        });
    }

    if (isGameRunning) {
        parseAndRenderBDVR(serverMapData);
        spawnSafely();

        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            enableMobileUI();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (!isGameRunning) {
            if (e.key === '`' || e.key === '~') {
                document.getElementById('no-args-overlay').style.display = 'none';
                isGameRunning = true;
                localPlayerName = 'DevPlayer';
                appendChat("System", "Running in Offline Sandbox Mode.");
                
                let avatarXhr = new XMLHttpRequest();
                avatarXhr.open("GET", `game.aspx?action=avatar&user=${encodeURIComponent(localPlayerName)}`, true);
                avatarXhr.onreadystatechange = function() {
                    if (avatarXhr.readyState === 4 && avatarXhr.status === 200) {
                        if (avatarXhr.responseText) rebuildLocalAvatar(avatarXhr.responseText);
                    }
                };
                avatarXhr.send();
                spawnSafely();
            }
        }
    });

    function appendChat(author, msg) {
        const log = document.getElementById('chat-log');
        const div = document.createElement('div');
        div.innerHTML = `<strong>${author}:</strong> ${msg}`;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    let isChatFocused = false;
    const chatInput = document.getElementById('chat-input');

    chatInput.addEventListener('focus', () => {
        isChatFocused = true;
        for (let k in keys) keys[k] = false;
    });

    chatInput.addEventListener('blur', () => {
        isChatFocused = false;
    });

    function sendChatMessage() {
        const msg = chatInput.value.trim();
        if (msg !== '') {
            if (msg.toLowerCase() === '/mobile') {
                enableMobileUI();
                appendChat("System", "Mobile controls enabled.");
                chatInput.value = '';
                chatInput.blur();
                return;
            }
            chatInput.value = '';
            let chatXhr = new XMLHttpRequest();
            chatXhr.open("GET", `game.aspx?action=chat&room=${encodeURIComponent(roomName)}&user=${encodeURIComponent(localPlayerName)}&text=${encodeURIComponent(msg)}`, true);
            chatXhr.send();
        }
        chatInput.blur();
    }

    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            sendChatMessage();
        }
    });

    const keys = {};
    window.addEventListener('keydown', (e) => {
        if (e.key === '/' && !isChatFocused) {
            e.preventDefault();
            const chatContainer = document.getElementById('chat-container');
            if (chatContainer.style.display === 'none') {
                chatContainer.style.display = 'flex';
            }
            chatInput.focus();
            return;
        }

        if (e.key === ' ' && !isChatFocused) e.preventDefault();
        keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    const speed = 0.25;

    let isSyncing = false;
    function pollServerSync() {
        if (!isGameRunning) return;
        if (isSyncing) return;
        isSyncing = true;

        let syncXhr = new XMLHttpRequest();
        syncXhr.open("GET", `game.aspx?action=sync&room=${encodeURIComponent(roomName)}&user=${encodeURIComponent(localPlayerName)}&x=${localMesh.position.x}&y=${localMesh.position.y}&z=${localMesh.position.z}&rot=${localMesh.rotation.y}&sword=${hasSwordEquipped}`, true);
        syncXhr.onreadystatechange = function() {
            if (syncXhr.readyState === 4) {
                isSyncing = false;
                if (syncXhr.status === 200) {
                    try {
                        const data = JSON.parse(syncXhr.responseText);

                        const activeNames = new Set();
                        if (data.players) {
                            data.players.forEach(p => {
                                const playerName = p.username || p.Username || p.name;
                                if (playerName) {
                                    activeNames.add(playerName);

                                    if (playerName === localPlayerName && p.health !== undefined) {
                                        playerHealth = p.health;
                                        const healthFill = document.getElementById('health-bar-fill');
                                        healthFill.style.width = playerHealth + '%';
                                        if (playerHealth <= 30) {
                                            healthFill.style.backgroundColor = '#ff0000';
                                        } else {
                                            healthFill.style.backgroundColor = '#00ff00';
                                        }
                                        if (playerHealth <= 0) {
                                            spawnSafely();
                                            playerHealth = 100;
                                            healthFill.style.width = '100%';
                                            healthFill.style.backgroundColor = '#00ff00';
                                            let respawnXhr = new XMLHttpRequest();
                                            respawnXhr.open("GET", `game.aspx?action=respawn&room=${encodeURIComponent(roomName)}&user=${encodeURIComponent(localPlayerName)}`, true);
                                            respawnXhr.send();
                                        }
                                    }

                                    if (playerName !== localPlayerName) {
                                        const playerHasSword = p.hasSword || false;
                                        const avatarStateKey = p.avatarData + "_" + playerHasSword;

                                        if (!remotePlayers[playerName]) {
                                            const remoteColors = parseAvatarColors(p.avatarData, 0xcc0000);
                                            const remoteMesh = createClassicAvatar(remoteColors, playerName, playerHasSword);
                                            remoteMesh.userData = { targetX: p.x, targetY: p.y, targetZ: p.z, targetRot: p.rotation, stateKey: avatarStateKey };
                                            scene.add(remoteMesh);
                                            remotePlayers[playerName] = remoteMesh;
                                        } else {
                                            if (remotePlayers[playerName].userData.stateKey !== avatarStateKey) {
                                                scene.remove(remotePlayers[playerName]);
                                                const remoteColors = parseAvatarColors(p.avatarData, 0xcc0000);
                                                const remoteMesh = createClassicAvatar(remoteColors, playerName, playerHasSword);
                                                remoteMesh.userData = { targetX: p.x, targetY: p.y, targetZ: p.z, targetRot: p.rotation, stateKey: avatarStateKey };
                                                scene.add(remoteMesh);
                                                remotePlayers[playerName] = remoteMesh;
                                            } else {
                                                remotePlayers[playerName].userData.targetX = p.x;
                                                remotePlayers[playerName].userData.targetY = p.y;
                                                remotePlayers[playerName].userData.targetZ = p.z;
                                                remotePlayers[playerName].userData.targetRot = p.rotation;
                                            }
                                        }
                                    }
                                }
                            });
                        }

                        const playerListEl = document.getElementById('player-names-list');
                        playerListEl.innerHTML = '';
                        activeNames.add(localPlayerName);
                        activeNames.forEach(name => {
                            const li = document.createElement('li');
                            li.textContent = name;
                            playerListEl.appendChild(li);
                        });

                        Object.keys(remotePlayers).forEach(name => {
                            if (!activeNames.has(name)) {
                                scene.remove(remotePlayers[name]);
                                delete remotePlayers[name];
                            }
                        });

                        if (data.chats) {
                            const chatLogEl = document.getElementById('chat-log');
                            if (data.chats.length === 0) {
                                chatLogEl.innerHTML = '';
                                lastProcessedChatId = 0;
                            } else {
                                data.chats.forEach(c => {
                                    if (c.id > lastProcessedChatId) {
                                        appendChat(c.user, c.text);
                                        lastProcessedChatId = c.id;
                                    }
                                });
                            }
                        }
                    } catch (e) {}
                }
            }
        };
        syncXhr.send();
    }

    setInterval(pollServerSync, 50);

    function animate(time) {
        requestAnimationFrame(animate);

        if (isGameRunning) {
            let moveX = 0;
            let moveZ = 0;

            if (!isChatFocused) {
                const forwardX = -Math.sin(cameraYaw);
                const forwardZ = -Math.cos(cameraYaw);
                const rightX = Math.cos(cameraYaw);
                const rightZ = -Math.sin(cameraYaw);

                if (keys['w']) { moveX += forwardX; moveZ += forwardZ; }
                if (keys['s']) { moveX -= forwardX; moveZ -= forwardZ; }
                if (keys['a']) { moveX -= rightX; moveZ -= rightZ; }
                if (keys['d']) { moveX += rightX; moveZ += rightZ; }

                if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                    moveX += forwardX * (-joystickVector.y) + rightX * joystickVector.x;
                    moveZ += forwardZ * (-joystickVector.y) + rightZ * joystickVector.x;
                }

                if (moveX !== 0 || moveZ !== 0) {
                    const len = Math.hypot(moveX, moveZ);
                    const normX = moveX / len;
                    const normZ = moveZ / len;

                    localMesh.position.x += normX * speed;
                    if (checkCollision(getPlayerBox(localMesh.position.x, localMesh.position.y, localMesh.position.z))) {
                        localMesh.position.x -= normX * speed;
                    }

                    localMesh.position.z += normZ * speed;
                    if (checkCollision(getPlayerBox(localMesh.position.x, localMesh.position.y, localMesh.position.z))) {
                        localMesh.position.z -= normZ * speed;
                    }

                    const targetAngle = Math.atan2(-normX, -normZ);
                    localMesh.rotation.y = targetAngle;
                }

                if (keys[' '] && isGrounded) {
                    velocityY = jumpStrength;
                    isGrounded = false;
                }
            }

            if (isSwinging) {
                swordSwingProgress += 0.15;
                const rightArmObj = localMesh.getObjectByName("rightArm");
                if (rightArmObj) {
                    rightArmObj.rotation.x = -Math.sin(swordSwingProgress) * 1.5;
                }
                if (swordSwingProgress >= Math.PI) {
                    isSwinging = false;
                    swordSwingProgress = 0;
                    if (rightArmObj) rightArmObj.rotation.x = 0;
                }
            }

            velocityY += gravity;
            localMesh.position.y += velocityY;

            let pBox = getPlayerBox(localMesh.position.x, localMesh.position.y, localMesh.position.z);
            if (checkCollision(pBox)) {
                if (velocityY < 0) {
                    let highestY = -999;
                    for (let i = 0; i < collisionBoxes.length; i++) {
                        const b = collisionBoxes[i];
                        if (localMesh.position.x + 1.2 > b.min.x && localMesh.position.x - 1.2 < b.max.x &&
                            localMesh.position.z + 1.2 > b.min.z && localMesh.position.z - 1.2 < b.max.z) {
                            if (b.max.y <= localMesh.position.y + 1.5 && b.max.y > highestY) {
                                highestY = b.max.y;
                            }
                        }
                    }
                    if (highestY !== -999) {
                        localMesh.position.y = highestY;
                    } else {
                        while (checkCollision(getPlayerBox(localMesh.position.x, localMesh.position.y, localMesh.position.z))) {
                            localMesh.position.y += 0.05;
                        }
                    }
                    velocityY = 0;
                    isGrounded = true;
                } else if (velocityY > 0) {
                    while (checkCollision(getPlayerBox(localMesh.position.x, localMesh.position.y, localMesh.position.z))) {
                        localMesh.position.y -= 0.05;
                    }
                    velocityY = 0;
                }
            } else {
                let groundTestBox = getPlayerBox(localMesh.position.x, localMesh.position.y - 0.1, localMesh.position.z);
                if (velocityY <= 0 && checkCollision(groundTestBox)) {
                    isGrounded = true;
                } else {
                    isGrounded = false;
                }
            }

            if (localMesh.position.y < -50) {
                spawnSafely();
                playerHealth = 100;
                const healthFill = document.getElementById('health-bar-fill');
                healthFill.style.width = '100%';
                healthFill.style.backgroundColor = '#00ff00';
                let respawnXhr = new XMLHttpRequest();
                respawnXhr.open("GET", `game.aspx?action=respawn&room=${encodeURIComponent(roomName)}&user=${encodeURIComponent(localPlayerName)}`, true);
                respawnXhr.send();
            }

            Object.keys(remotePlayers).forEach(name => {
                const rp = remotePlayers[name];
                if (rp.userData) {
                    rp.position.x += (rp.userData.targetX - rp.position.x) * 0.3;
                    rp.position.y += (rp.userData.targetY - rp.position.y) * 0.3;
                    rp.position.z += (rp.userData.targetZ - rp.position.z) * 0.3;
                    rp.rotation.y = rp.userData.targetRot;
                }
            });
        }

        const targetY = localMesh.position.y + 3.5;
        const camX = localMesh.position.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
        const camY = targetY + cameraDistance * Math.sin(cameraPitch);
        const camZ = localMesh.position.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);

        camera.position.set(camX, camY, camZ);
        camera.lookAt(localMesh.position.x, targetY, localMesh.position.z);

        renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
